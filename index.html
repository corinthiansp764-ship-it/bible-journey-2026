<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="Bible Journey 2026 - Acompanhamento do plano de leitura bíblica.">
<link rel="manifest" href="manifest.json">
<title>Bible Journey 2026</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--accent:#bb86fc;--text:#e0e0e0;--completed:#03dac6;--muted:#aaa}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:16px;margin:0;max-width:760px;margin-inline:auto;padding-bottom:32px}
h1{text-align:center;color:var(--accent);font-size:1.5rem;margin:8px 0 4px}
.subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:16px}
.progress-container{background:var(--card);padding:16px;border-radius:14px;margin-bottom:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25);position:sticky;top:8px;z-index:5}
.progress-bar{background:#333;border-radius:8px;height:12px;overflow:hidden;margin-top:10px}
.progress-fill{background:var(--completed);height:100%;width:0%;transition:width .3s ease}
.month-title{font-size:1.2rem;font-weight:bold;margin:20px 0 10px;color:var(--accent);border-bottom:1px solid #333;padding-bottom:6px}
.item{display:flex;align-items:center;background:var(--card);padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;user-select:none;transition:background .2s,transform .1s}
.item:active{transform:scale(.99);opacity:.85}
.checkbox{width:23px;height:23px;border-radius:50%;border:2px solid var(--accent);margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.item.checked .checkbox{background:var(--completed);border-color:var(--completed)}
.item.checked .checkbox::after{content:'✓';color:#000;font-size:14px;font-weight:bold}
.item.checked .text{text-decoration:line-through;opacity:.55}
.day{font-weight:bold;color:var(--accent);margin-right:9px;min-width:28px}
.text{font-size:.95rem;line-height:1.35}
.actions{display:flex;gap:8px;margin:0 0 18px}
button{flex:1;border:0;border-radius:9px;padding:10px;background:#2a2a2a;color:var(--text);font-weight:600}
button:active{opacity:.75}
footer{text-align:center;color:#777;font-size:.75rem;margin-top:25px}
</style>
</head>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="actions">
  <button onclick="markAll(false)">Desmarcar tudo</button>
  <button onclick="markAll(true)">Concluir tudo</button>
</div>

<div id="app"></div>
<footer>Seu progresso é salvo automaticamente neste aparelho.</footer>

let state = JSON.parse(localStorage.getItem('bibleJourneyState') || '{}');

function saveState(){
  localStorage.setItem('bibleJourneyState', JSON.stringify(state));
  updateProgress();
}

function toggleItem(key, element){
  state[key] = !state[key];
  element.classList.toggle('checked', !!state[key]);
  saveState();
}

function markAll(value){
  plan.forEach(m=>m.days.forEach(d=>state[`${m.month}-${d.day}`]=value));
  saveState();
  renderApp();
}

function updateProgress(){
  let total=0, completed=0;
  plan.forEach(m=>m.days.forEach(d=>{
    total++;
    if(state[`${m.month}-${d.day}`]) completed++;
  }));
  const percent=total?Math.round(completed/total*100):0;
  document.getElementById('progress-text').innerText=`Progresso: ${percent}% (${completed} de ${total} concluídos)`;
  document.getElementById('progress-fill').style.width=percent+'%';
}

function renderApp(){
  const container=document.getElementById('app');
  container.innerHTML='';
  plan.forEach(m=>{
    const title=document.createElement('div');
    title.className='month-title';
    title.innerText=m.month;
    container.appendChild(title);

    m.days.forEach(d=>{
      const key=`${m.month}-${d.day}`;
      const item=document.createElement('div');
      item.className='item'+(state[key]?' checked':'');
      item.onclick=()=>toggleItem(key,item);

      const checkbox=document.createElement('div');
      checkbox.className='checkbox';

      const day=document.createElement('span');
      day.className='day';
      day.innerText=d.day;

      const text=document.createElement('span');
      text.className='text';
      text.innerText=d.text;

      item.append(checkbox,day,text);
      container.appendChild(item);
    });
  });
  updateProgress();
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
renderApp();
</script>
